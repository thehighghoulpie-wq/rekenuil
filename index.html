<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekenuil">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Rekenuil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpolygon points='26,40 34,12 50,32' fill='%237C5CD6'/%3E%3Cpolygon points='94,40 86,12 70,32' fill='%237C5CD6'/%3E%3Cellipse cx='60' cy='66' rx='40' ry='44' fill='%237C5CD6'/%3E%3Cellipse cx='60' cy='84' rx='24' ry='22' fill='%23EDE6FF'/%3E%3Ccircle cx='44' cy='54' r='15' fill='%23fff'/%3E%3Ccircle cx='76' cy='54' r='15' fill='%23fff'/%3E%3Ccircle cx='46' cy='56' r='7' fill='%232E3A59'/%3E%3Ccircle cx='74' cy='56' r='7' fill='%232E3A59'/%3E%3Cpolygon points='54,68 66,68 60,78' fill='%23FFB547'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#2E3A59; --ink2:#5F6B88; --line:#EDE4D3;
  --brand:#5B8DEF; --brand-d:#3F6FD1;
  --good:#2FB57A; --good-d:#23905F; --good-t:#E3F7EE;
  --bad:#F08A4B; --bad-d:#D06C2E; --bad-t:#FFF0E6;
  --gold:#FFC23D; --frac:#FFC857;
  --accent:#5B8DEF; --tint:#EAF1FF; --accent-d:#3F6FD1;
  --shadow:0 4px 0 rgba(46,58,89,.07), 0 10px 26px rgba(46,58,89,.07);
  --keysh:#E6DCC8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:20px;line-height:1.4;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
h1,h2,h3{margin:0;line-height:1.2}
b{font-weight:800}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1100px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.narrow{max-width:780px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:10px 24px;border-radius:20px;background:var(--brand);color:#fff;font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--brand-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d)}
.btn.big{min-height:74px;font-size:26px;width:100%}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--keysh)}
.btn.soft:active{box-shadow:0 1px 0 var(--keysh)}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-d)}
.btn.accent{background:var(--accent-d);box-shadow:0 5px 0 rgba(46,58,89,.28)}
.btn.accent:active{box-shadow:0 1px 0 rgba(46,58,89,.28)}
.icon-btn{width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:28px;display:grid;place-items:center;flex:none}
.btn-back{min-height:52px;padding:8px 18px;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:19px}

/* ---------- mascot ---------- */
.owl{width:100%;height:100%;display:block}
.mascot{width:96px;height:96px;flex:none;animation:bob 3.2s ease-in-out infinite}
.mascot.sm{width:78px;height:78px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.owl .lid{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}

/* ---------- home ---------- */
.home-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.greet{flex:1;min-width:0}
.greet h1{font-size:clamp(28px,5vw,40px);font-weight:900}
.greet p{margin:4px 0 0;color:var(--ink2);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 18px}
.chip{background:#fff;border-radius:99px;padding:8px 16px;box-shadow:var(--shadow);font-weight:700;font-size:18px;white-space:nowrap}
.chip b{font-size:20px}
.tip{background:#fff;border-radius:20px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow);font-size:19px;border-left:8px solid var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:900px),(orientation:landscape) and (min-width:820px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:16px 16px 14px;min-height:150px;border-radius:24px;background:var(--t);border:3px solid var(--c);box-shadow:0 6px 0 var(--c);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c)}
.tile-ico{font-size:40px;line-height:1;margin-bottom:6px}
.tile-name{font-weight:900;font-size:21px;line-height:1.15}
.tile-sub{font-size:16px;color:var(--ink2)}
.tile-meta{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:#D8D0C0;display:inline-block;flex:none}
.dot.l1{background:var(--bad)} .dot.l2{background:#F5C542} .dot.l3{background:var(--good)}
.home-actions{margin-top:20px;display:flex;gap:12px}
.home-actions .btn{flex:1}

/* ---------- setup ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.setup-head{display:flex;align-items:center;gap:16px;background:var(--tint);border:3px solid var(--accent);border-radius:24px;padding:16px 20px;margin-bottom:8px}
.setup-head .ico{font-size:52px;line-height:1}
.setup-head h1{font-size:clamp(26px,4.5vw,34px);font-weight:900}
.setup-head p{margin:2px 0 0;color:var(--ink2)}
.lbl{font-size:20px;font-weight:800;margin:20px 4px 10px;color:var(--ink2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:#fff;border-radius:22px;padding:16px 12px;box-shadow:var(--shadow);border:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:40px;text-align:center}
.mode b{font-size:24px}
.mode span{font-size:16px;color:var(--ink2);line-height:1.3}
.mode.sel,.seg button.sel{border-color:var(--accent);background:var(--tint)}
.seg{display:flex;gap:10px}
.seg button{flex:1;min-height:64px;background:#fff;border-radius:18px;font-weight:800;box-shadow:var(--shadow);border:4px solid transparent;font-size:19px;padding:6px 8px;line-height:1.2}
.record{margin:20px 0 16px;background:#fff;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);font-size:19px;text-align:center}

/* ---------- quiz ---------- */
#quiz.active{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.qbar{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px}
.qstop{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:24px;font-weight:900;flex:none;color:var(--ink2)}
.qprog{flex:1;min-width:0}
.qprog-label{font-weight:800;font-size:18px;margin:0 0 4px 4px;white-space:nowrap}
.bar{height:16px;border-radius:99px;background:#EDE4D3;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s linear}
.qprog.urgent .bar i{background:var(--bad)}
.qprog.urgent .qprog-label{color:var(--bad-d);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.qstat{background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap;font-size:19px;flex:none}
.qstat.hot{background:#FFEBD9;animation:pop .35s}
.qmain{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:0 14px max(14px,env(safe-area-inset-bottom))}
@media (orientation:landscape) and (min-width:740px){
  .qmain{grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);grid-template-rows:minmax(0,1fr)}
  .qinput{align-self:center}
}
.qcard{position:relative;background:#fff;border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 18px 16px;min-height:0;overflow:auto;border-top:8px solid var(--accent)}
.qcard>.qinner{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.qtopic{position:absolute;top:10px;left:14px;font-size:15px;font-weight:800;color:var(--ink2);background:var(--tint);border-radius:99px;padding:3px 12px}
.qvisual:empty{display:none}
.qvisual{display:flex;justify-content:center;align-items:center;max-width:100%}
.qtext{font-size:clamp(30px,5.6vw,56px);font-weight:900;text-align:center;line-height:1.3;max-width:100%}
.qtext.long{font-size:clamp(21px,3.3vw,30px);font-weight:700;max-width:36ch;line-height:1.45}
.qtext.long b{font-weight:900}
.qdisplay[hidden]{display:none}
.ans{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(32px,5.4vh,50px);font-weight:900;flex-wrap:wrap}
.abox{min-width:3em;min-height:1.45em;padding:0 .35em;border:4px dashed #D2C6AE;border-radius:18px;text-align:center;background:#FFFDF8;line-height:1.3;transition:background .2s,border-color .2s}
.abox.focus{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 5px var(--tint)}
.abox.good{border-style:solid;border-color:var(--good);background:var(--good-t)}
.abox.bad{border-style:solid;border-color:var(--bad);background:var(--bad-t)}
.abox .ph{color:#C9BFAD;font-weight:700}
.unit{font-size:.62em;font-weight:800;color:var(--ink2)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.qtools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qtools button{min-height:50px;padding:6px 18px;border-radius:99px;background:#FFF4CF;font-weight:800;font-size:18px;box-shadow:0 4px 0 #F1DFA0}
.qtools button:active{transform:translateY(3px);box-shadow:0 1px 0 #F1DFA0}
.qtools .skip{background:#F1EDE6;box-shadow:0 4px 0 #DED6C8}
.qtools button[hidden]{display:none}
.hintbox{display:none;background:#FFF9E3;border:3px solid #FFE08A;border-radius:18px;padding:12px 16px;font-size:19px;max-width:600px;text-align:left;line-height:1.45}
.hintbox.show{display:block;animation:fadeIn .25s}

/* keypad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:clamp(54px,8vh,84px);font-size:clamp(28px,4.2vh,38px);font-weight:900;background:#fff;border-radius:18px;box-shadow:0 5px 0 var(--keysh);transition:transform .06s,box-shadow .06s}
.key:active,.key.press{transform:translateY(4px);box-shadow:0 1px 0 var(--keysh)}
.key.del{background:#F4EFE6;font-size:clamp(24px,3.6vh,32px)}
.key.sp{background:var(--tint);color:var(--accent-d)}
.key.restk{font-size:clamp(20px,3vh,26px)}
.key.ok{grid-column:span 3;background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d);font-size:clamp(24px,3.6vh,32px)}
.key.ok:active,.key.ok.press{box-shadow:0 1px 0 var(--good-d)}
@media (orientation:landscape) and (min-width:740px){
  .key{height:clamp(48px,12.2vh,92px)}
}
/* choices */
.choices{display:grid;gap:12px;grid-template-columns:1fr}
.choices.c2{grid-template-columns:repeat(2,1fr)}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choice{min-height:80px;font-size:clamp(20px,3.1vh,28px);background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--keysh);padding:12px 14px;font-weight:800;border:4px solid transparent;line-height:1.3;transition:transform .06s,box-shadow .06s}
.choices.big .choice{font-size:clamp(28px,4.4vh,40px)}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--keysh)}
.choice.good{background:var(--good-t);border-color:var(--good)}
.choice.bad{background:var(--bad-t);border-color:var(--bad)}
.choice svg.clock{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}

/* visuals */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.02;font-size:.86em;margin:0 .12em}
.frac>span{padding:0 .14em}
.frac>span:first-child{border-bottom:.08em solid currentColor;padding-bottom:.05em}
.frac>span:last-child{padding-top:.06em}
.box{display:inline-block;min-width:1.25em;padding:0 .18em;border:3px dashed var(--accent);border-radius:10px;color:var(--accent);line-height:1.15;text-align:center}
.frac .box{border-width:2px;min-width:1em}
svg.clock{width:min(250px,30vh);height:auto}
@media (orientation:landscape) and (min-width:740px){svg.clock{width:min(270px,40vh)}}
.cface{fill:#fff;stroke:var(--ink);stroke-width:5}
.tk{stroke:#A5ADBF;stroke-width:1.6}
.tk.big{stroke:var(--ink);stroke-width:3.4}
.cn{font-size:21px;font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-family:inherit}
.hh{stroke:#E2574C;stroke-width:9;stroke-linecap:round}
.mh{stroke:#3F6FD1;stroke-width:5.5;stroke-linecap:round}
.cc{fill:var(--ink)}
.digital{font-family:"Courier New",ui-monospace,Menlo,monospace;font-weight:700;font-size:clamp(48px,9vh,88px);background:#22313F;color:#7CF2B0;padding:.08em .5em;border-radius:20px;letter-spacing:.06em;box-shadow:inset 0 0 0 7px #3B4C5C;line-height:1.25}
.fbar{width:min(380px,80vw);height:auto}
.fpie{width:min(180px,24vh);height:auto}
.fon{fill:var(--frac);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.foff{fill:#fff;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.emo{font-size:clamp(52px,9vh,86px);line-height:1}
.ladder{display:flex;gap:4px;justify-content:center;margin:10px 0 4px;flex-wrap:nowrap}
.step{min-width:40px;padding:6px 3px;background:#F1ECFF;border-radius:10px;font-weight:800;font-size:16px;text-align:center;margin-top:calc(var(--i) * 8px)}
.step.from{background:var(--bad);color:#fff}
.step.to{background:var(--good);color:#fff}
.cmpbars{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:8px;font-size:24px;font-weight:800}
.cmpbars .fbar{width:100%;max-width:300px}

/* feedback sheet */
.fb{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(780px,100%);background:#fff;border-radius:30px 30px 0 0;box-shadow:0 -10px 40px rgba(46,58,89,.18);padding:20px 22px max(22px,env(safe-area-inset-bottom));transition:transform .28s ease;z-index:20;max-height:75vh;overflow:auto}
.fb.show{transform:translate(-50%,0)}
.fb.good{border-top:8px solid var(--good)}
.fb.bad{border-top:8px solid var(--bad)}
.fb-row{display:flex;align-items:center;gap:14px}
.fb-ico{font-size:46px;line-height:1}
.fb-title{font-size:28px;font-weight:900}
.fb.good .fb-title{color:var(--good-d)}
.fb.bad .fb-title{color:var(--bad-d)}
.fb-sub{font-size:20px}
.fb-ans{font-size:24px}
.fb-explain{margin:14px 0 16px;background:#F7F3EC;border-radius:18px;padding:14px 16px;font-size:20px;line-height:1.5}
.toast{position:fixed;top:90px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#fff;border-radius:99px;padding:12px 26px;font-weight:900;font-size:24px;box-shadow:0 10px 30px rgba(46,58,89,.2);transition:all .3s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* results */
.res-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.bubble{position:relative;flex:1;background:#fff;border-radius:22px;padding:14px 18px;box-shadow:var(--shadow)}
.bubble h1{font-size:clamp(26px,5vw,36px);font-weight:900}
.bubble p{margin:4px 0 0;color:var(--ink2)}
.bubble:before{content:"";position:absolute;left:-12px;top:30px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.stars-big{display:flex;justify-content:center;gap:8px;margin:16px 0 8px}
.stars-big svg{width:clamp(76px,17vw,116px);height:auto}
.s-off{fill:#ECE4D5}
.s-on{fill:var(--gold);stroke:#E5A51C;stroke-width:1.2;stroke-linejoin:round}
.stars-big .s-on{animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars-big svg:nth-child(2) .s-on{animation-delay:.25s}
.stars-big svg:nth-child(3) .s-on{animation-delay:.5s}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg);transform-origin:center;opacity:0}100%{transform:scale(1);opacity:1}}
.stars-big path{transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.banner{text-align:center;font-size:26px;font-weight:900;color:#B7791F;background:#FFF4CF;border-radius:20px;padding:12px;margin:8px 0;animation:pop .5s .6s both}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:14px 0}
.stat{background:#fff;border-radius:20px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:34px;font-weight:900;line-height:1.1}
.stat span{font-size:16px;color:var(--ink2);font-weight:700}
.newbadges{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:12px 0;text-align:center}
.newbadges h3{font-size:21px;margin-bottom:10px}
.nb{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:6px 10px;font-weight:800;font-size:16px;animation:pop .5s .8s both}
.nb i{font-style:normal;font-size:46px;line-height:1}
.sect-title{font-size:23px;font-weight:900;margin:26px 4px 12px}
.review{display:flex;flex-direction:column;gap:12px}
.rv{background:#fff;border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);border-left:8px solid var(--bad)}
.rv-q{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:22px;font-weight:800}
.rv-q .qtext-sm{flex:1;min-width:200px;line-height:1.45}
.rv-q .qtext-sm.long{font-size:19px;font-weight:700}
.rv-vis svg.clock{width:96px}
.rv-vis .digital{font-size:30px;border-radius:12px;box-shadow:inset 0 0 0 4px #3B4C5C}
.rv-vis .emo{font-size:40px}
.rv-vis .fbar{width:160px}
.rv-vis .fpie{width:80px}
.rv-a{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:19px;align-items:center}
.rv-a .you{color:var(--bad-d)}
.rv-ch{margin-top:6px;font-size:18px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rv-ch span{background:#F4EFE6;border-radius:12px;padding:2px 10px;color:var(--ink);font-weight:700}
.rv-a .ok{color:var(--good-d);font-weight:800}
.rv-a svg.clock{width:60px;vertical-align:middle}
.rv details{margin-top:8px;font-size:18px;color:var(--ink2)}
.rv summary{cursor:pointer;font-weight:800;color:var(--brand-d);padding:4px 0;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv details>div{margin-top:6px;line-height:1.5;color:var(--ink)}
.allgood{background:var(--good-t);border-radius:22px;padding:18px;text-align:center;font-size:21px;font-weight:800;color:var(--good-d)}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}

/* progress */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
body{overflow-x:hidden}
.pcard{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);border-left:8px solid var(--c);display:flex;flex-direction:column;gap:8px}
.pcard{min-width:0}
.pcard-head{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.pcard-head .ico{font-size:32px}
.pcard-head h3{font-size:20px;font-weight:900;flex:1;min-width:0}
.status{font-size:16px;font-weight:800;border-radius:99px;padding:3px 12px;background:#F1EDE6;white-space:nowrap}
.status.l1{background:var(--bad-t);color:var(--bad-d)}
.status.l2{background:#FFF4CF;color:#9A6B00}
.status.l3{background:var(--good-t);color:var(--good-d)}
.pbar{height:14px;border-radius:99px;background:#EDE4D3;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px}
.pmeta{font-size:16px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pcard .btn{min-height:50px;font-size:18px;padding:6px 16px;margin-top:4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.badge{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.badge i{display:block;font-style:normal;font-size:40px;line-height:1.2}
.badge b{display:block;font-size:16px}
.badge span{display:block;font-size:13px;color:var(--ink2);line-height:1.3}
.badge.off{opacity:.45;filter:grayscale(1)}
.hist{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px solid #F4EFE6;font-size:17px}
.hrow:last-child{border-bottom:0}
.hrow .ico{font-size:26px}
.hrow .mid{flex:1;min-width:0}
.hrow .mid b{display:block;font-size:18px}
.hrow .mid span{color:var(--ink2);font-size:15px}
.hrow .sc{text-align:right;font-weight:800;white-space:nowrap}
.empty{color:var(--ink2);text-align:center;padding:18px;font-size:18px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(46,58,89,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex;animation:fadeIn .2s}
.modal-card{background:#fff;border-radius:28px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card h2{font-size:28px;font-weight:900;margin-bottom:10px}
.modal-card p{margin:6px 0 0;color:var(--ink2)}
.modal-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.modal-actions .btn{flex:1;min-width:150px}
.field{margin-top:16px}
.field label{display:block;font-weight:800;margin-bottom:6px}
.field input[type=text]{width:100%;font:inherit;font-size:24px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:#FFFDF8;color:var(--ink)}
.field input[type=text]:focus{outline:none;border-color:var(--brand)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#F8F4ED;border-radius:16px;padding:12px 16px;font-weight:800;margin-top:12px}
.toggle{width:72px;height:42px;border-radius:99px;background:#D8D0C0;position:relative;transition:background .2s;flex:none}
.toggle:after{content:"";position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.toggle.on{background:var(--good)}
.toggle.on:after{left:34px}
.hold{position:relative;overflow:hidden;background:#fff;color:#B4483A;box-shadow:0 5px 0 #F0D6D1;border:3px solid #F0D6D1;width:100%;font-size:18px}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#FBE1DC}
.hold.go i{width:100%;transition:width 2s linear}
.hold span{position:relative}
.small{font-size:16px;color:var(--ink2)}
.parents{margin-top:30px;background:#fff;border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);font-size:17px;color:var(--ink2)}
.parents h3{color:var(--ink);font-size:19px;margin-bottom:6px}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (max-width:520px){
  body{font-size:18px}
  .tile{min-height:136px;padding:14px 12px 12px}

  .seg button{font-size:17px}
  .qstat{padding:6px 10px;font-size:17px}
  .res-actions{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<script>
(function(){
'use strict';

/* =====================================================================
   Kleine hulpjes
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const kies = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const BOX = '<span class="box">?</span>';
const frac = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const fracP = p => frac(p[0], p[1]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => String(s).replace(/<[^>]*>/g, '');
const pad2 = n => String(n).padStart(2, '0');
const tstr = (h, m) => `${h}:${pad2(m)}`;
const norm = t => ((t % 1440) + 1440) % 1440;
const tstrM = t => { t = norm(t); return tstr(Math.floor(t / 60), t % 60); };
const plural = (n, een, meer) => n === 1 ? een : meer;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// Nederlandse getalnotatie: komma voor decimalen, punt bij 10.000 en meer
function fmt(n) {
  const r = Math.round(n * 1000) / 1000;
  let s = Math.abs(r).toString();
  if (s.includes('e')) s = Math.abs(r).toFixed(3);
  let [i, d] = s.split('.');
  if (i.length > 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (r < 0 ? '−' : '') + i + (d ? ',' + d : '');
}
const euro = c => '€ ' + (c / 100).toFixed(2).replace('.', ',');
const NAMES = ['Noor','Daan','Emma','Sem','Lotte','Milan','Sara','Bram','Yara','Ayoub','Fenna','Luuk','Mila','Finn','Zoë','Levi','Isa','Jesse'];

/* =====================================================================
   Plaatjes (SVG)
   ===================================================================== */
const OWL = `<svg class="owl" viewBox="0 0 120 120" aria-hidden="true">
  <ellipse cx="60" cy="114" rx="30" ry="4" fill="#000" opacity=".08"/>
  <polygon points="24,42 32,10 50,32" fill="#6A4BC4"/><polygon points="96,42 88,10 70,32" fill="#6A4BC4"/>
  <ellipse cx="60" cy="66" rx="40" ry="44" fill="#7C5CD6"/>
  <path d="M22 70 Q14 86 30 98 Q28 82 34 72Z" fill="#6A4BC4"/><path d="M98 70 Q106 86 90 98 Q92 82 86 72Z" fill="#6A4BC4"/>
  <ellipse cx="60" cy="84" rx="24" ry="22" fill="#EDE6FF"/>
  <path d="M48 80 q4 4 8 0 M56 88 q4 4 8 0 M64 80 q4 4 8 0" stroke="#C9BCF2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="44" cy="54" r="16" fill="#fff"/><circle cx="76" cy="54" r="16" fill="#fff"/>
  <circle cx="46" cy="56" r="7.5" fill="#2E3A59"/><circle cx="74" cy="56" r="7.5" fill="#2E3A59"/>
  <circle cx="48.5" cy="53" r="2.4" fill="#fff"/><circle cx="76.5" cy="53" r="2.4" fill="#fff"/>
  <g class="lid"><circle cx="44" cy="54" r="16.5" fill="#7C5CD6"/><circle cx="76" cy="54" r="16.5" fill="#7C5CD6"/></g>
  <polygon points="54,68 66,68 60,79" fill="#FFB547"/>
  <ellipse cx="50" cy="109" rx="7" ry="3.5" fill="#FFB547"/><ellipse cx="70" cy="109" rx="7" ry="3.5" fill="#FFB547"/>
</svg>`;
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on ? 's-on' : 's-off'}" d="M12 2.4l2.95 6 6.6.95-4.78 4.65 1.13 6.57L12 17.47l-5.9 3.1 1.13-6.57L2.45 9.35l6.6-.95z"/></svg>`;

function clockSVG(h, m, cls = '') {
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  let ticks = '', nums = '';
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 83 : 88, r2 = 94;
    ticks += `<line x1="${(100 + r1 * Math.sin(a)).toFixed(1)}" y1="${(100 - r1 * Math.cos(a)).toFixed(1)}" x2="${(100 + r2 * Math.sin(a)).toFixed(1)}" y2="${(100 - r2 * Math.cos(a)).toFixed(1)}" class="tk${big ? ' big' : ''}"/>`;
  }
  for (let i = 1; i <= 12; i++) {
    const a = i * 30 * Math.PI / 180;
    nums += `<text x="${(100 + 68 * Math.sin(a)).toFixed(1)}" y="${(100 - 68 * Math.cos(a)).toFixed(1)}" class="cn">${i}</text>`;
  }
  return `<svg class="clock ${cls}" viewBox="0 0 200 200" role="img" aria-label="Klok"><circle cx="100" cy="100" r="96" class="cface"/>${ticks}${nums}` +
    `<line x1="100" y1="108" x2="100" y2="54" class="hh" transform="rotate(${ha.toFixed(1)} 100 100)"/>` +
    `<line x1="100" y1="112" x2="100" y2="22" class="mh" transform="rotate(${ma} 100 100)"/><circle cx="100" cy="100" r="7" class="cc"/></svg>`;
}
const digital = (h, m) => `<div class="digital">${pad2(h)}:${pad2(m)}</div>`;

function fracBar(n, d) {
  const w = 300, h = 54, cw = w / d;
  let s = `<svg class="fbar" viewBox="0 0 ${w + 6} ${h + 6}" role="img" aria-label="${n} van de ${d} delen gekleurd">`;
  for (let i = 0; i < d; i++) s += `<rect x="${(3 + i * cw).toFixed(2)}" y="3" width="${cw.toFixed(2)}" height="${h}" class="${i < n ? 'fon' : 'foff'}"/>`;
  return s + '</svg>';
}
function fracPie(n, d) {
  const cx = 60, cy = 60, r = 55;
  let s = `<svg class="fpie" viewBox="0 0 120 120" role="img" aria-label="${n} van de ${d} stukken gekleurd">`;
  for (let i = 0; i < d; i++) {
    const a1 = (i / d) * 2 * Math.PI - Math.PI / 2, a2 = ((i + 1) / d) * 2 * Math.PI - Math.PI / 2;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1), x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    s += `<path d="M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" class="${i < n ? 'fon' : 'foff'}"/>`;
  }
  return s + '</svg>';
}

// keuzevraag maken: goed antwoord + foute opties, gehusseld
function mkChoice(correct, wrongs, n = 3) {
  const ws = [...new Set(wrongs.filter(w => w && w !== correct))];
  const opts = shuffle([correct, ...shuffle(ws).slice(0, n - 1)]);
  return { kind: 'choice', choices: opts, answer: opts.indexOf(correct) };
}

/* =====================================================================
   1. TAFELS
   ===================================================================== */
function jumps(a, b) { return Array.from({ length: b }, (_, i) => (i + 1) * a).join(', '); }
function genTafels(diff) {
  const tables = diff === 'easy' ? [1, 2, 3, 4, 5, 10] : diff === 'medium' ? [2, 3, 4, 5, 6, 7, 8, 9, 10] : [3, 4, 6, 7, 8, 9];
  const a = kies(tables);
  const b = diff === 'hard' ? rnd(2, 10) : rnd(1, 10);
  const r = Math.random();
  const variant = diff === 'easy' ? 'plain' : diff === 'medium' ? (r < .25 ? 'missing' : 'plain') : (r < .3 ? 'missing' : r < .5 ? 'tens' : 'plain');
  const p = a * b;
  if (variant === 'missing') return {
    text: `${BOX} × ${a} = ${p}`, kind: 'num', answer: b,
    hint: `Zeg de tafel van ${a} op: ${a}, ${2 * a}, ${3 * a}, … Bij de hoeveelste kom je op ${p}?`,
    explain: `${b} × ${a} = ${p}. Dus op de plaats van het vraagteken hoort <b>${b}</b>.`
  };
  if (variant === 'tens') return {
    text: `${a} × ${b * 10} =`, kind: 'num', answer: p * 10,
    hint: `Reken eerst ${a} × ${b}. Zet er daarna een 0 achter.`,
    explain: `${a} × ${b} = ${p}. ${b * 10} is tien keer zo veel als ${b}, dus het antwoord is ook tien keer zo veel: <b>${p * 10}</b>.`
  };
  let hint, explain;
  if (b === 10) { hint = `Keer 10: zet een 0 achter ${a}.`; explain = `10 × ${a} = <b>${p}</b>. Bij keer 10 zet je een 0 achter het getal.`; }
  else if (b === 1) { hint = `1 keer een getal is gewoon dat getal.`; explain = `1 × ${a} = <b>${a}</b>.`; }
  else if (b === 5) { hint = `5 × ${a} is de helft van 10 × ${a} = ${10 * a}.`; explain = `5 × ${a} = <b>${p}</b>. Dat is de helft van 10 × ${a} = ${10 * a}.`; }
  else if (b > 5) { hint = `Weet je 5 × ${a}? Dat is ${5 * a}. Tel er dan nog ${b - 5} × ${a} bij.`; explain = `${b} × ${a} = <b>${p}</b>. Handig: 5 × ${a} = ${5 * a} en ${b - 5} × ${a} = ${(b - 5) * a}. Samen ${p}.`; }
  else { hint = `Tel in sprongen van ${a}: ${a}, ${2 * a}, …`; explain = `${b} × ${a} = <b>${p}</b>. In sprongen van ${a}: ${jumps(a, b)}.`; }
  return { text: `${b} × ${a} =`, kind: 'num', answer: p, hint, explain };
}

/* =====================================================================
   2. DELEN (ook met rest)
   ===================================================================== */
function genDelen(diff) {
  if (diff === 'easy') {
    const d = kies([2, 3, 4, 5, 10]), q = rnd(1, 10), n = d * q;
    return { text: `${n} : ${d} =`, kind: 'num', answer: q,
      hint: `Welk getal keer ${d} is ${n}? Denk aan de tafel van ${d}.`,
      explain: `${q} × ${d} = ${n}, dus ${n} : ${d} = <b>${q}</b>.` };
  }
  const restQ = (n, d, q, r, extra) => ({
    text: `${n} : ${d} =`, kind: 'rest', answer: { q, r },
    hint: extra && extra.hint || `Zoek in de tafel van ${d} het grootste getal dat niet groter is dan ${n}. Wat er overblijft is de rest.`,
    explain: extra && extra.explain || (r
      ? `${q} × ${d} = ${d * q}. Er blijft ${n} − ${d * q} = ${r} over. Dus ${n} : ${d} = <b>${q} rest ${r}</b>.`
      : `${q} × ${d} = ${n}. Er blijft niets over, dus ${n} : ${d} = <b>${q}</b> (rest 0).`)
  });
  if (diff === 'medium') {
    const d = rnd(2, 10), q = rnd(1, 10), r = Math.random() < .6 ? rnd(1, d - 1) : 0;
    return restQ(d * q + r, d, q, r);
  }
  // moeilijk
  const v = Math.random();
  if (v < .6) {
    const d = rnd(3, 9), q = rnd(11, 29), r = Math.random() < .5 ? rnd(1, d - 1) : 0, n = d * q + r;
    const t = Math.floor(q / 10) * 10, p1 = d * t, rest = n - p1;
    return restQ(n, d, q, r, {
      hint: `Splits ${n} in twee handige stukken. Begin met ${p1}: dat is ${t} × ${d}.`,
      explain: `Splits ${n} in ${p1} en ${rest}.<br>${p1} : ${d} = ${t}.<br>${rest} : ${d} = ${q - t}${r ? ' rest ' + r : ''}.<br>Samen: <b>${q}${r ? ' rest ' + r : ''}</b>.`
    });
  }
  if (v < .85) {
    const d = rnd(2, 9), q = rnd(2, 9) * 10, n = d * q;
    return restQ(n, d, q, 0, {
      hint: `Reken eerst ${n / 10} : ${d}. Zet er dan een 0 achter.`,
      explain: `${n / 10} : ${d} = ${q / 10}. Dan is ${n} : ${d} tien keer zo veel: <b>${q}</b>.`
    });
  }
  const q = rnd(12, 99), n = q * 10;
  return restQ(n, 10, q, 0, {
    hint: `Bij delen door 10 haal je een 0 weg.`,
    explain: `${n} : 10 = <b>${q}</b>. Bij delen door 10 haal je de 0 aan het eind weg.`
  });
}

/* =====================================================================
   3. PLUS EN MIN tot 10.000
   ===================================================================== */
const placeVal = (n, p) => p === 1000 ? Math.floor(n / 1000) * 1000 : Math.floor(n / p) % 10 * p;
function explainPlus(a, b) {
  const parts = [], sums = [];
  for (const p of [1000, 100, 10, 1]) {
    const pa = placeVal(a, p), pb = placeVal(b, p);
    if (pa || pb) { parts.push(`${fmt(pa)} + ${fmt(pb)} = ${fmt(pa + pb)}`); sums.push(fmt(pa + pb)); }
  }
  if (parts.length === 1) return `${fmt(a)} + ${fmt(b)} = <b>${fmt(a + b)}</b>.`;
  return `Splits de getallen:<br>${parts.join('<br>')}<br>Samen: ${sums.join(' + ')} = <b>${fmt(a + b)}</b>.`;
}
function explainMinus(a, b) {
  let cur = a; const steps = [];
  for (const p of [1000, 100, 10, 1]) {
    const pb = placeVal(b, p);

function parseDec(s) {
  if (!s) return NaN;
  s = s.replace(',', '.');
  if (!/^\d*\.?\d*$/.test(s) || s === '.') return NaN;
  return parseFloat(s);
}
function parseTime(s) {
  if (!s) return null;
  let h, m;
  if (s.includes(':')) { const [a, b] = s.split(':'); if (a === '' || !b || b.length !== 2) return null; h = +a; m = +b; }
  else { if (s.length < 3 || s.length > 4) return null; h = +s.slice(0, -2); m = +s.slice(-2); }
  if (isNaN(h) || isNaN(m) || m > 59 || h > 24) return null;
  return { h, m };
}
function checkAnswer(q, g) {
  switch (q.kind) {
    case 'num': { const v = parseDec(g.a); return !isNaN(v) && Math.abs(v - q.answer) < 1e-6; }
    case 'rest': return /^\d+$/.test(g.a) && +g.a === q.answer.q && (g.r === '' || g.r == null ? 0 : +g.r) === q.answer.r;
    case 'time': {
      const t = parseTime(g.a); if (!t || t.m !== q.answer.m) return false;
      return q.twelve ? t.h % 12 === q.answer.h % 12 : t.h % 24 === q.answer.h % 24;
    }
    case 'choice': return g.choice === q.answer;
  }
  return false;
}
function answerText(q) {
  if (q.answerText) return q.answerText;
  switch (q.kind) {
    case 'num': return (q.prefix ? q.prefix + ' ' : '') + fmt(q.answer) + (q.unit ? ' ' + q.unit : '');
    case 'rest': return q.answer.r ? `${q.answer.q} rest ${q.answer.r}` : `${q.answer.q}`;
    case 'time': return tstr(q.answer.h, q.answer.m);
    case 'choice': return q.choices[q.answer];
  }
}
function givenText(q, g) {
  if (g.skip) return 'overgeslagen';
  switch (q.kind) {
    case 'num': return (q.prefix ? q.prefix + ' ' : '') + esc(g.a) + (q.unit ? ' ' + q.unit : '');
    case 'rest': return g.r && g.r !== '0' ? `${esc(g.a)} rest ${esc(g.r)}` : esc(g.a);
    case 'time': return esc(g.a);
    case 'choice': return q.choices[g.choice];
  }
}

function tone(freqs, dur = .12, type = 'sine', vol = .07) {

}

function confetti(amount = 150) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const cols = ['#FF9F7A', '#6DB8F7', '#6FCF8A', '#F6BE3B', '#A98BF5', '#F58BB4', '#4FC8BA'];
  const P = Array.from({ length: amount }, () => ({
    x: Math.random() * W, y: -Math.random() * H * .6, vx: (Math.random() - .5) * 3 * dpr, vy: (2 + Math.random() * 3.5) * dpr,
    r: (5 + Math.random() * 6) * dpr, rot: Math.random() * 6, vr: (Math.random() - .5) * .25, c: kies(cols), s: Math.random() < .5
  }));
  const start = performance.now();
  (function frame(now) {
    const el = now - start;
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .03 * dpr; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, Math.min(1, (3200 - el) / 600));
      if (p.s) ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); else { ctx.beginPath(); ctx.arc(0, 0, p.r / 2.4, 0, 6.3); ctx.fill(); }
      ctx.restore();
    });
    if (el < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(start);
}

function renderDisplay() {

$('#qinput').addEventListener('click', e => {

function pressKey(k) {
  if (S.locked) return;

  if (k === 'rest') { S.input.field = f === 'a' ? 'r' : 'a'; renderDisplay(); return; }

  else if (k === ',') { if (q.kind !== 'num' || !q.comma || v.includes(',')) return; v = (v === '' ? '0' : v) + ','; }
  else if (k === ':') { if (q.kind !== 'time' || v.includes(':') || v === '' || v.length > 2) return; v += ':'; }
  else if (/^\d$/.test(k)) {
    if (v.length >= 8) return;

    else if (v === '0') v = '';

function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

const GOOD = ['Goed zo!', 'Super!', 'Knap gedaan!', 'Top!', 'Yes!', 'Helemaal goed!', 'Lekker bezig!', 'Wauw!', 'Prima!', 'Klopt!'];

function record(q, ok, g) {

document.addEventListener('keydown', e => {

  if (S.locked) { if (e.key === 'Enter' && $('#fb-next')) { e.preventDefault(); next(); } return; }
  const q = S.q;
  if (q.kind === 'choice') { const n = parseInt(e.key, 10); if (n >= 1 && n <= q.choices.length) submit(n - 1); return; }
  let k = null;
  if (/^\d$/.test(e.key)) k = e.key;

  else if (e.key === ':') k = ':';

  else if (e.key === 'Enter') k = 'ok';
  else if ((e.key === 'Tab' || e.key === ' ' || e.key === 'r') && q.kind === 'rest') k = 'rest';

function finish() {
  stopTimer(); clearTimeout(advanceT);
  $('#fb').classList.remove('show');
  const total = S.answered, correct = S.correct, acc = total ? correct / total : 0;
  let stars = 0;
  if (S.mode === 'practice') stars = acc >= .9 ? 3 : acc >= .7 ? 2 : acc >= .5 ? 1 : 0;
  else {
    const goal = TOPIC[S.topic].pace[S.diff] * S.duration / 60;
    stars = correct >= goal ? 3 : correct >= goal * .6 ? 2 : correct >= goal * .3 ? 1 : 0;
    if (acc < .6) stars = Math.min(stars, 1);
  }
  if (!total) stars = 0;
  const hk = highKey(), prev = D.highs[hk] || 0, isRecord = S.score > prev;
  if (isRecord) D.highs[hk] = S.score;
  D.points += S.score; D.stars += stars; D.quizzes++;
  topicStats(S.topic).quizzes++;
  if (!D.days.includes(today())) { D.days.push(today()); if (D.days.length > 400) D.days.shift(); }
  D.history.unshift({ t: Date.now(), topic: S.topic, mode: S.mode, diff: S.diff, len: S.mode === 'timed' ? S.duration : S.count, score: S.score, correct, total, stars });
  D.history = D.history.slice(0, 30);
  // badges
  const earn = [];
  const give = id => { if (!D.badges[id]) { D.badges[id] = Date.now(); earn.push(id); } };
  give('first');
  if (D.quizzes >= 10) give('q10');
  if (D.quizzes >= 50) give('q50');
  if (S.bestStreak >= 5) give('s5');
  if (S.bestStreak >= 10) give('s10');
  if (S.bestStreak >= 20) give('s20');
  if (D.answered >= 100) give('a100');
  if (D.answered >= 500) give('a500');
  if (D.answered >= 1000) give('a1000');
  if (S.mode === 'practice' && total >= 10 && correct === total) give('perfect');
  if (REAL.every(id => D.topics[id] && D.topics[id].answered > 0)) give('all');
  if (S.diff === 'hard' && total >= 5) give('hard');
  if (S.diff === 'hard' && stars === 3) give('hard3');
  if (S.mode === 'timed' && S.duration === 60 && correct >= 15) give('blitz');
  const ds = dayStreak();
  if (ds >= 3) give('d3');
  if (ds >= 7) give('d7');
  if (D.stars >= 50) give('st50');
  if (S.topic === 'klok' && stars === 3) give('clock');
  if (S.topic === 'tafels' && S.diff === 'hard' && stars === 3) give('tables');
  save();
  renderResults({ stars, acc, isRecord: isRecord && prev > 0, firstRecord: isRecord && prev === 0 && S.score > 0, earn, total, correct });
  show('results');
  if (stars >= 2 || (isRecord && prev > 0) || earn.length) { setTimeout(() => confetti(stars === 3 ? 200 : 130), 250); SND.win(); }
}

    <div class="field"><label for="in-name">Hoe heet je?</label><input type="text" id="in-name" maxlength="20" autocomplete="off" placeholder="Je naam" value="${esc(D.name)}"></div>
    <div class="switch"><span>🔊 Geluidjes</span><button class="toggle ${D.sound ? 'on' : ''}" id="tg-sound" aria-label="Geluid aan of uit"></button></div>
    <div class="field"><label>Opnieuw beginnen</label><button class="btn hold" id="btn-reset"><i></i><span>Houd 2 seconden ingedrukt om alles te wissen</span></button>
    <p class="small">Dit wist alle punten, sterren, records en badges op dit apparaat.</p></div>`,
    [{ label: 'Klaar ✓', cls: 'good', fn: () => { D.name = $('#in-name') ? $('#in-name').value.trim().slice(0, 20) : D.name; save(); renderHome(); } }]);
  const nameIn = $('#in-name');
  $('.modal-actions .btn').onclick = () => { D.name = nameIn.value.trim().slice(0, 20); save(); closeModal(); renderHome(); };
  $('#tg-sound').onclick = e => { D.sound = !D.sound; e.currentTarget.classList.toggle('on', D.sound); save(); SND.good(); };
  const rb = $('#btn-reset'); let ht;
  const startHold = e => { e.preventDefault(); rb.classList.add('go'); ht = setTimeout(() => { const nm = D.name; D = defaults(); D.name = nm; save(); closeModal(); renderHome(); toast('🧹 Alles is gewist'); }, 2000); };
  const stopHold = () => { rb.classList.remove('go'); clearTimeout(ht); };
  rb.addEventListener('pointerdown', startHold);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => rb.addEventListener(ev, stopHold));
}

// iOS: geluid pas na eerste aanraking
document.addEventListener('pointerdown', () => { if (AC && AC.state === 'suspended') AC.resume(); }, { passive: true });

// testhaakje (alleen voor controle; doet verder niets)
window.Rekenuil = { TOPICS, checkAnswer, answerText, parseTime, fmt };

// offline werken (alleen als de app via een webadres geopend is)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

renderHome();
show('home');
})();
</script>
</body>
</html>
